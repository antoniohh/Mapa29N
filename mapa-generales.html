<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Votos por Secciones en Extremadura</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        .voc-map-contenedor {
            width: 100%;
            height: 600px;
            position: relative;
            font-family: 'Guardian TextSans Regular', sans-serif;
        }

        #voc-map {
            width: 100%;
            height: 600px;
            position: relative;
            z-index: 1;
        }

        @media (max-width:699px) {
            #voc-map {
                height: 500px;
            }
        }

        .maplibregl-popup {
            pointer-events: none;
            z-index: 20;
        }

        .maplibregl-popup-content {
            background: transparent !important;
            border-radius: 0px !important;
            box-shadow: none !important;
            padding: 0px !important;
        }

        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: #ffffff !important;
        }

        .maplibregl-popup-anchor-top .maplibregl-popup-tip {
            border-bottom-color: #ffffff !important;
        }

        .voc-custom-tooltip {
            width: 250px;
            box-sizing: border-box;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.06);
            font-family: 'Guardian TextSans Regular', sans-serif;
            font-size: 13px;
            line-height: 1.35;
            color: #202020;
        }

        .voc-tooltip-header {
            border-bottom: 1px solid #eaeAEA;
            padding-bottom: 7px;
            margin-bottom: 8px;
        }

        .voc-tooltip-title {
            font-family: 'Guardian TextSans Medium', sans-serif;
            font-weight: bold;
            font-size: 15px;
            color: #111111;
            line-height: 1.25;
            display: block;
        }

        .voc-tooltip-subtitle {
            font-size: 11px;
            color: #767676;
            margin-top: 2px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .voc-tooltip-results {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .voc-party-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            gap: 6px;
        }

        .voc-party-info {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 75px;
            max-width: 90px;
        }

        .voc-party-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .voc-party-name {
            font-family: 'Guardian TextSans Medium', sans-serif;
            font-weight: 500;
            color: #222222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .voc-party-bar-track {
            flex: 1;
            height: 5px;
            background: #edeef0;
            border-radius: 3px;
            overflow: hidden;
        }

        .voc-party-bar-fill {
            height: 100%;
            border-radius: 3px;
        }

        .voc-party-pct {
            font-family: 'Guardian TextSans Medium', sans-serif;
            font-weight: bold;
            color: #111111;
            min-width: 44px;
            text-align: right;
        }

        .voc-map-search-box {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: #ffffff;
            padding: 4px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 4px;
            width: calc(100% - 70px);
            max-width: 300px;
        }

        .voc-map-search-input {
            border: 1px solid #ccc;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 3px;
            flex-grow: 1;
            outline: none;
            font-family: 'Guardian TextSans Regular', sans-serif;
        }

        .voc-map-search-button {
            background: #202020;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }

        .voc-map-search-button:hover {
            background: #404040;
        }
    </style>
</head>

        <div id="voc-map"></div>
